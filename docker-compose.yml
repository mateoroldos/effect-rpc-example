services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: effect_template
      POSTGRES_PASSWORD: effect_template
      POSTGRES_USER: effect_template
    ports:
      - name: postgres
        target: 5432
        published: "${POSTGRES_PORT:?Set POSTGRES_PORT in .env}"
        host_ip: 127.0.0.1
        protocol: tcp
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  postgres-data:
