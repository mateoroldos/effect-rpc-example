services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: effect_template
      POSTGRES_PASSWORD: effect_template
      POSTGRES_USER: effect_template
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5434}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  postgres-data:
