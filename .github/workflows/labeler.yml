name: Labeler

on: [pull_request]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  label:
    name: Label by path
    runs-on: ubuntu-latest
    # Fork PRs get a read-only token, so labeling can only fail. Skip them
    # (neutral, not red) — same-repo PRs still label. See README GitHub automation.
    if: ${{ github.event.pull_request.head.repo.fork == false }}
    permissions:
      contents: read
      issues: write # required to create labels in repositories made from the template
      pull-requests: write # required to add labels
    timeout-minutes: 5
    steps:
      - uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit
      - uses: actions/labeler@b8dd2d9be0f68b860e7dae5dae7d772984eacd6d # v6.2.0
