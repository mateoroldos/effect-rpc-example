      - any-glob-to-any-file: "apps/**"
web:
  - changed-files:
      - any-glob-to-any-file: "apps/web/**"
server:
  - changed-files:
      - any-glob-to-any-file: "apps/server/**"
packages:
  - changed-files:
      - any-glob-to-any-file: "packages/**"
infra:
  - changed-files:
      - any-glob-to-any-file: ["alchemy.run.ts", "packages/infra/**"]
